[package]
name = "proprix-desktop"
version = "0.2.2"
description = "PROPRIX desktop shell"
edition = "2021"
license = "MIT"

[lib]
name = "proprix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-shell = "2.6"
tauri-plugin-notification = "2.8"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
getrandom = "0.3"
